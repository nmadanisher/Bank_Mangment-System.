<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login">
    <form id="loginForm" class="login-box">
      <div class="logo">🏦</div>
      <h2>Bank Management System</h2>
      <p>Admin Login</p>
      <input id="user" placeholder="Username" required>
      <input id="pass" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <small>Demo: admin / admin123</small>
    </form>
  </div>

  <div id="app" class="hidden">
    <nav>
      <h1>🏦 PK Bank</h1>
      <div>
        <button id="themeBtn" class="ghost">🌙</button>
        <button id="logoutBtn" class="ghost">Logout</button>
      </div>
    </nav>

    <main>
      <section class="stats">
        <div class="stat"><small>Total Accounts</small><span id="statAccounts">0</span></div>
        <div class="stat"><small>Total Balance (PKR)</small><span id="statBalance">0</span></div>
        <div class="stat"><small>Transactions</small><span id="statTxn">0</span></div>
      </section>

      <div class="grid2">
        <section class="card">
          <h2>➕ Open New Account</h2>
          <form id="createForm">
            <input id="name" placeholder="Account holder name" required>
            <input id="cnic" placeholder="CNIC: 43101-1234567-1" pattern="[0-9]{5}-[0-9]{7}-[0-9]" required>
            <select id="type"><option>Savings</option><option>Current</option></select>
            <input id="initial" type="number" min="0" placeholder="Initial deposit (PKR)" required>
            <button type="submit">Create Account</button>
          </form>
        </section>

        <section class="card">
          <h2>💸 Transaction</h2>
          <form id="txnForm">
            <select id="txnAcc" required></select>
            <select id="txnType">
              <option value="deposit">Deposit</option>
              <option value="withdraw">Withdraw</option>
              <option value="transfer">Transfer</option>
            </select>
            <select id="toAcc" class="hidden"></select>
            <input id="amount" type="number" min="1" placeholder="Amount (PKR)" required>
            <button type="submit">Submit</button>
          </form>
        </section>
      </div>

      <section class="card">
        <h2>💳 Accounts</h2>
        <input id="search" placeholder="🔍 Search by name or account no...">
        <div id="cards" class="cards"></div>
      </section>

      <div class="grid2">
        <section class="card">
          <h2>📊 Balance Chart</h2>
          <canvas id="chart" height="220"></canvas>
        </section>
        <section class="card" id="statement">
          <h2>🧾 History <small id="histFor"></small>
            <button class="small noprint" onclick="window.print()">Print</button></h2>
          <ul id="history"></ul>
        </section>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
